name: Build BYD Web Bridge V0.2.10 Native Google Maps
on:
  push:
    branches: [byd-gpack-web-bridge-v0210]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Build Debug APK
        working-directory: byd-gpack-web-bridge
        run: gradle --no-daemon assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: BYD-Web-Bridge-V0210-Native-Maps-APK
          path: byd-gpack-web-bridge/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
