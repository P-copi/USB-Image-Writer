name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [ "main", "feature/v028-deep-inspector", "feature/v0215-smart-compact-backup", "feature/v0216-ext4-metadata-audit", "feature/v0217-ext4-shrink-sandbox", "feature/v0218-bundled-e2fsprogs", "feature/v0219-file-integrity-shrink", "feature/v0220-arc3-sparse-mirror", "feature/v0221-safe-arc3-shrink" ]

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
      USB_SIGNING_PASSPHRASE: ${{ secrets.USB_SIGNING_PASSPHRASE }}
    steps:
      - name: Checkout app
        uses: actions/checkout@v5

      - name: Checkout patched libaums source
        uses: actions/checkout@v5
        with:
          repository: magnusja/libaums
          ref: 57fa4826b792d46073a3329a303a6c9bec430fc8
          path: _libaums

      - name: Set up JDK 21 for libaums
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Prepare Android SDK
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0" \
            "platforms;android-33" \
            "build-tools;33.0.2" \
            "ndk;25.2.9519653" \
            "cmake;3.22.1"

      - name: Apply USB recovery patch to libaums
        run: python3 scripts/patch_libaums_v014.py _libaums

      - name: Build patched libaums AAR
        run: |
          printf 'sdk.dir=%s\nlibusb.dir=/tmp/libusb\n' "$ANDROID_HOME" > _libaums/local.properties
          mkdir -p /tmp/libusb
          chmod +x _libaums/gradlew
          _libaums/gradlew -p _libaums :libaums:assembleRelease --stacktrace
          mkdir -p app/libs
          cp _libaums/libaums/build/outputs/aar/libaums-release.aar app/libs/libaums-patched.aar
          ls -lh app/libs/libaums-patched.aar
          rm -rf _libaums

      # e2fsprogs is an open-source EXT filesystem toolchain. Build from source
      # and package Android ARM64 PIE executables in the extracted native lib dir.
      # See OFFLINE_SHRINK_V0218.md for license/source and security constraints.
      - name: Checkout e2fsprogs v1.47.2 source
        uses: actions/checkout@v5
        with:
          repository: tytso/e2fsprogs
          ref: v1.47.2
          path: _e2fsprogs

      - name: Cross-compile e2fsprogs with Android NDK (arm64-v8a)
        shell: bash
        run: |
          set -euo pipefail
          TOOLCHAIN="$ANDROID_HOME/ndk/25.2.9519653/toolchains/llvm/prebuilt/linux-x86_64"
          export CC="$TOOLCHAIN/bin/aarch64-linux-android26-clang"
          export AR="$TOOLCHAIN/bin/llvm-ar"
          export RANLIB="$TOOLCHAIN/bin/llvm-ranlib"
          export STRIP="$TOOLCHAIN/bin/llvm-strip"
          export CFLAGS="-O2 -fPIE"
          export LDFLAGS="-pie"
          mkdir -p _e2fsprogs-build
          cd _e2fsprogs-build
          ../_e2fsprogs/configure --host=aarch64-linux-android \
            --disable-nls --disable-uuidd --disable-fuse2fs \
            --disable-backtrace --disable-imager \
            --disable-defrag --disable-rpath --enable-libuuid --enable-libblkid
          make -j4
          cd ..
          OUT="app/src/main/jniLibs/arm64-v8a"
          mkdir -p "$OUT"
          cp _e2fsprogs-build/misc/mke2fs "$OUT/libmke2fs.so"
          cp _e2fsprogs-build/e2fsck/e2fsck "$OUT/libe2fsck.so"
          cp _e2fsprogs-build/resize/resize2fs "$OUT/libresize2fs.so"
          cp _e2fsprogs-build/debugfs/debugfs "$OUT/libdebugfs.so"
          chmod 755 "$OUT/"*.so
          for f in "$OUT/"*.so; do
            echo "CHECK NDK executable: $f"
            file "$f"
            "$TOOLCHAIN/bin/llvm-readelf" -h "$f" | grep -E "Class:|Machine:|Type:"
            "$TOOLCHAIN/bin/llvm-readelf" -d "$f" | grep NEEDED || true
            # LLVM readelf labels a PIE ET_DYN as "Shared object file".
            # Check ET_DYN + PT_INTERP instead of matching its display label.
            if ! "$TOOLCHAIN/bin/llvm-readelf" -h "$f" | grep -qE "Type:.*DYN"; then
              echo "::error::$f is not ELF ET_DYN"
              exit 1
            fi
            if ! "$TOOLCHAIN/bin/llvm-readelf" -l "$f" | grep -q INTERP; then
              echo "::error::$f has no executable interpreter (PT_INTERP)"
              exit 1
            fi
          done
          sha256sum "$OUT/"*.so
          # Record the exact source commit in workflow logs.
          git -C _e2fsprogs rev-parse HEAD

      - name: Set up JDK 17 for app
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Unlock permanent signing identity
        if: env.USB_SIGNING_PASSPHRASE != ''
        shell: bash
        run: |
          set -euo pipefail
          base64 -d scripts/usb-release-keystore.enc.b64 > "$RUNNER_TEMP/usb-release-key.enc"
          openssl enc -d -aes-256-cbc -pbkdf2 -iter 250000 \
            -in "$RUNNER_TEMP/usb-release-key.enc" \
            -out "$RUNNER_TEMP/usb-release-keystore.p12" \
            -pass env:USB_SIGNING_PASSPHRASE
          chmod 600 "$RUNNER_TEMP/usb-release-keystore.p12"
          echo "USB_KEYSTORE_PATH=$RUNNER_TEMP/usb-release-keystore.p12" >> "$GITHUB_ENV"

      - name: Build stable signed release APK
        if: env.USB_SIGNING_PASSPHRASE != ''
        run: gradle :app:assembleRelease --stacktrace

      - name: Upload stable signed APK
        if: env.USB_SIGNING_PASSPHRASE != ''
        uses: actions/upload-artifact@v4
        with:
          name: USB-Image-Writer-v0.2.33-PREVIEW-SIGNED
          path: app/build/outputs/apk/release/app-release.apk
          retention-days: 14

      - name: Validate signed release APK
        if: env.USB_SIGNING_PASSPHRASE != ''
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/release/app-release.apk"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose "$APK"
          sha256sum "$APK"

      # Development fallback only. Debug signatures vary across GitHub runners.
      # Do not distribute Debug builds as update-in-place installation packages.
      - name: Build debug APK
        if: env.USB_SIGNING_PASSPHRASE == ''
        run: gradle :app:assembleDebug --stacktrace

      - name: Upload Debug APK (not upgradeable)
        if: env.USB_SIGNING_PASSPHRASE == ''
        uses: actions/upload-artifact@v4
        with:
          name: USB-Image-Writer-v0.2.33-PREVIEW-DEBUG-UNSIGNED-IDENTITY
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 3
