name: Build BYD Phone Space Stable-Signed APK

on:
  workflow_dispatch:
  push:
    branches: [ "feature/byd-phone-space-v0.1" ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
      BYD_SIGNING_KEYSTORE: /tmp/byd-phone-space-signing.p12
      BYD_SIGNING_PASSWORD: ${{ secrets.BYD_SIGNING_PASSWORD }}
    steps:
      - name: Checkout app
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Prepare Android SDK
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      # The update key is stored ONLY in encrypted repository secrets, not git or cache.
      - name: Restore stable signing key
        shell: bash
        env:
          BYD_SIGNING_KEYSTORE_BASE64: ${{ secrets.BYD_SIGNING_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          if [[ -z "$BYD_SIGNING_KEYSTORE_BASE64" || -z "$BYD_SIGNING_PASSWORD" ]]; then
            echo "::error::Configure BYD_SIGNING_KEYSTORE_BASE64 and BYD_SIGNING_PASSWORD in Actions secrets."
            exit 1
          fi
          printf '%s' "$BYD_SIGNING_KEYSTORE_BASE64" | base64 --decode > "$BYD_SIGNING_KEYSTORE"
          chmod 600 "$BYD_SIGNING_KEYSTORE"
          keytool -list -storetype PKCS12 -keystore "$BYD_SIGNING_KEYSTORE" \
            -storepass "$BYD_SIGNING_PASSWORD" -alias "byd-phone-space" >/dev/null

      - name: Build stable-signed APK
        shell: bash
        run: |
          set -euo pipefail
          gradle :app:assembleDebug --stacktrace --no-daemon 2>&1 | tee /tmp/byd-build.log

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: BYDPhoneSpace-build-log
          path: /tmp/byd-build.log
          retention-days: 3

      - name: Verify APK and permanent signing certificate
        shell: bash
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify \
            --min-sdk-version 26 --verbose --print-certs "$APK" | tee /tmp/byd-sign-verify.log
          EXPECTED="2859cc6d8afc6b3e864565ba1d7249473fea55527cf22fa7f25559f3004cda6f"
          if ! grep -qi "Signer #1 certificate SHA-256 digest: $EXPECTED" /tmp/byd-sign-verify.log; then
            echo "::error::Unexpected APK signing certificate. Do not distribute this APK."
            exit 1
          fi

      - name: Upload stable-signed APK
        uses: actions/upload-artifact@v4
        with:
          name: BYDPhoneSpace-stable-signed
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
