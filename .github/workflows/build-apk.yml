name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
      USB_SIGNING_PASSPHRASE: ${{ secrets.USB_SIGNING_PASSPHRASE }}
    steps:
      - name: Checkout app
        uses: actions/checkout@v5

      - name: Checkout patched libaums source
        uses: actions/checkout@v5
        with:
          repository: magnusja/libaums
          ref: 57fa4826b792d46073a3329a303a6c9bec430fc8
          path: _libaums

      - name: Set up JDK 21 for libaums
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Prepare Android SDK
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0" \
            "platforms;android-33" \
            "build-tools;33.0.2" \
            "ndk;25.2.9519653" \
            "cmake;3.22.1"

      - name: Apply USB recovery patch to libaums
        run: python3 scripts/patch_libaums_v014.py _libaums

      - name: Build patched libaums AAR
        run: |
          printf 'sdk.dir=%s\nlibusb.dir=/tmp/libusb\n' "$ANDROID_HOME" > _libaums/local.properties
          mkdir -p /tmp/libusb
          chmod +x _libaums/gradlew
          _libaums/gradlew -p _libaums :libaums:assembleRelease --stacktrace
          mkdir -p app/libs
          cp _libaums/libaums/build/outputs/aar/libaums-release.aar app/libs/libaums-patched.aar
          ls -lh app/libs/libaums-patched.aar
          rm -rf _libaums

      - name: Set up JDK 17 for app
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Unlock permanent signing identity
        if: env.USB_SIGNING_PASSPHRASE != ''
        shell: bash
        run: |
          set -euo pipefail
          base64 -d scripts/usb-release-keystore.enc.b64 > "$RUNNER_TEMP/usb-release-key.enc"
          openssl enc -d -aes-256-cbc -pbkdf2 -iter 250000 \
            -in "$RUNNER_TEMP/usb-release-key.enc" \
            -out "$RUNNER_TEMP/usb-release-keystore.p12" \
            -pass env:USB_SIGNING_PASSPHRASE
          chmod 600 "$RUNNER_TEMP/usb-release-keystore.p12"
          echo "USB_KEYSTORE_PATH=$RUNNER_TEMP/usb-release-keystore.p12" >> "$GITHUB_ENV"

      - name: Build stable signed release APK
        if: env.USB_SIGNING_PASSPHRASE != ''
        run: gradle :app:assembleRelease --stacktrace

      - name: Upload stable signed APK
        if: env.USB_SIGNING_PASSPHRASE != ''
        uses: actions/upload-artifact@v4
        with:
          name: USB-Image-Writer-v0.2.1-SIGNED
          path: app/build/outputs/apk/release/app-release.apk
          retention-days: 14

      - name: Validate signed release APK
        if: env.USB_SIGNING_PASSPHRASE != ''
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/release/app-release.apk"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose "$APK"
          sha256sum "$APK"

      # Development fallback only. Debug signatures vary across GitHub runners.
      # Do not distribute Debug builds as update-in-place installation packages.
      - name: Build debug APK
        if: env.USB_SIGNING_PASSPHRASE == ''
        run: gradle :app:assembleDebug --stacktrace

      - name: Upload Debug APK (not upgradeable)
        if: env.USB_SIGNING_PASSPHRASE == ''
        uses: actions/upload-artifact@v4
        with:
          name: USB-Image-Writer-v0.2.1-DEBUG-UNSIGNED-IDENTITY
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 3
