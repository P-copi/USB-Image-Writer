name: Verify BYD Source Compile (no APK distribution)

on:
  push:
    branches: [ "feature/byd-phone-space-v0.1" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compile:
    runs-on: ubuntu-latest
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
      # Only for configuration of the compile task; never creates or distributes a signed APK.
      BYD_SIGNING_KEYSTORE: /tmp/compile-only-no-keystore.p12
      BYD_SIGNING_PASSWORD: compile-only-placeholder
    steps:
      - name: Checkout source
        uses: actions/checkout@v5
      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - name: Prepare Android SDK
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-35" "build-tools;35.0.0"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Compile Java and Android resources, no APK output
        shell: bash
        run: |
          set -euo pipefail
          gradle :app:compileDebugJavaWithJavac --stacktrace --no-daemon 2>&1 | tee /tmp/verify-compile.log
      - name: Upload compile log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: BYDPhotoImport-compile-errors
          path: /tmp/verify-compile.log
          retention-days: 3
