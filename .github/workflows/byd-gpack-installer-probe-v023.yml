name: BYD GPack Installer Probe 0.2.3
on:
  push:
    branches:
      - byd-gpack-installer-probe-v023
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Android SDK
        run: |
          SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" -maxdepth 4 -type f -name sdkmanager | head -n 1)
          test -n "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Build embedded Mini Bridge
        working-directory: byd-gpack-installer-probe
        run: |
          gradle --no-daemon :mini:assembleDebug
          mkdir -p probe/src/main/assets
          cp mini/build/outputs/apk/debug/mini-debug.apk probe/src/main/assets/test-mini-bridge.apk
      - name: Build Installer Probe
        working-directory: byd-gpack-installer-probe
        run: gradle --no-daemon :probe:assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: BYD-GPack-Installer-Probe-v023
          path: |
            byd-gpack-installer-probe/probe/build/outputs/apk/debug/probe-debug.apk
            byd-gpack-installer-probe/mini/build/outputs/apk/debug/mini-debug.apk
          if-no-files-found: error
